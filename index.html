state={started:false,name:'',lang:'hi',current:0,answers:{},review:{},visited:{},seconds:7200,finished:false};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=id=>DATA.questions.find(x=>x.id===id); const sectionFor=id=>DATA.sections.find(s=>s.ids.includes(id));
function start(){state.name=$('name').value.trim()||'Candidate';state.lang=$('pref').value;state.started=true;state.current=0;state.seconds=7200;state.visited={1:true};
 renderTest();tick();}
function tick(){clearInterval(window.tmr);window.tmr=setInterval(()=>{if(!state.started||state.finished)return;state.seconds--;if(state.seconds<=0){state.seconds=0;finish(true)}updateTimer()},1000);updateTimer()}
function updateTimer(){let m=Math.floor(state.seconds/60),s=state.seconds%60;let el=$('timer');if(el)el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function setLang(l){state.lang=l;renderTest()}
function choose(i){state.answers[state.current+1]=i;renderTest()}
function clearAns(){delete state.answers[state.current+1];renderTest()}
function toggleReview(){let id=state.current+1;state.review[id]=!state.review[id];renderTest()}
function go(id){state.current=id-1;state.visited[id]=true;renderTest()}
function next(){if(state.current<119){state.current++;state.visited[state.current+1]=true;renderTest()}}
function prev(){if(state.current>0){state.current--;state.visited[state.current+1]=true;renderTest()}}
async function finish(auto=false){if(state.finished)return;state.finished=true;clearInterval(window.tmr);renderResult();}
function status(id){let a=state.answers[id],r=state.review[id];if(r&&a!==undefined)return'reviewAnswered';if(r)return'review';if(a!==undefined)return'answered';if(state.visited[id])return'visited';return''}
function renderStart(){
 $('app').innerHTML=`<div class="wrap"><section class="card start"><h1>SUPER TET MOCK TEST 04</h1><p><b>JobAlerT Special Test</b> · 120 Questions · 360 Marks · 120 Minutes</p><div class="inst"><b>Instructions</b><br>• Correct: +3 marks &nbsp; • Wrong: −1 mark &nbsp; • Unattempted: 0<br>• Question Palette, Next/Back, Clear Response, Mark for Review, End Exam and Auto Submit are enabled.<br>• <b>हर bilingual question पर Hindi / English बदली जा सकती है।</b><br>• Hindi, English और Sanskrit subject के प्रश्न मूल भाषा में ही रहेंगे।<br>• Result page contains score, section-wise analysis, question-wise response review and a <b>Save Response Sheet as PDF</b> button. PDF print view includes <b>© JobAlerT</b> header, watermark and footer.</div><div style="margin-top:16px"><label>Name<br><input id="name" style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px" placeholder="Enter your name"></label></div><div style="margin-top:12px"><label>Preferred starting language<br><select id="pref" style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px"><option value="hi">हिन्दी / Hindi</option><option value="en">English</option></select></label></div><div style="margin-top:16px"><button class="btn primary" onclick="start()">Start Test</button></div></section></div>`}
function richHtml(value){
  const s=String(value??'');
  const escaped=esc(s);
  return escaped
    .replace(/&lt;br\s*\/&gt;/gi,'<br>')
    .replace(/&lt;sup&gt;(.*?)&lt;\/sup&gt;/gi,'<sup>$1</sup>')
    .replace(/&lt;sub&gt;(.*?)&lt;\/sub&gt;/gi,'<sub>$1</sub>');
}
function passageHtml(value){return '<div class="passage-box">'+richHtml(value)+'</div>';}

function renderTest(){
 let id=state.current+1,Q=q(id),sec=sectionFor(id), lang=state.lang;let stem=lang==='en'&&Q.en?Q.en:Q.hi;let stemHtml=lang==='en'&&Q.enHtml?Q.enHtml:(lang==='hi'&&Q.hiHtml?Q.hiHtml:stem);let opts=lang==='en'&&Q.optionsEn?.length===Q.optionsHi.length?Q.optionsEn:Q.optionsHi;let bilingual=!!Q.en;let selected=state.answers[id];
 let optionHtml=opts.map((o,i)=>`<div class="opt ${selected===i?'selected':''}" onclick="choose(${i})"><span class="optletter">${String.fromCharCode(65+i)})</span><span>${richHtml(o)}</span></div>`).join('');
 let palette=DATA.sections.map(s=>`<div class="secTitle">${esc(s.name)} <span class="sectiontag">(${s.count})</span></div><div class="grid">${s.ids.map(n=>`<button class="pbtn ${status(n)} ${n===id?'current':''}" onclick="go(${n})">${n}</button>`).join('')}</div>`).join('');
 $('app').innerHTML=`<header class="top"><div class="brand">SUPER TET MOCK TEST 04</div><div class="name">${esc(state.name)}</div><div class="timer" id="timer">120:00</div></header><div class="wrap"><div class="layout"><section class="card question"><div class="qhead"><div><div class="qno">Question ${id} of 120</div><div class="sectiontag">${esc(sec.name)}</div></div><div><button class="btn secondary" onclick="clearAns()">Clear Response</button> <button class="btn purple" onclick="toggleReview()">${state.review[id]?'Unmark Review':'Mark for Review'}</button></div></div><div class="langbar"><b>Test Language:</b>${bilingual?`<button class="${lang==='hi'?'active':''}" onclick="setLang('hi')">हिन्दी</button><button class="${lang==='en'?'active':''}" onclick="setLang('en')">English</button>`:`<span class="sectiontag">Original language only for this section</span>`}</div><div class="stem">${Q.passage?passageHtml(Q.passage):""}${richHtml(stemHtml)}</div><div class="opts">${optionHtml}</div><div class="nav"><button class="btn secondary" onclick="prev()" ${id===1?'disabled':''}>← Back</button><button class="btn danger" onclick="finish(false)">End Exam</button><button class="btn primary" onclick="next()" ${id===120?'disabled':''}>Next →</button></div></section><aside class="card palette"><h3 style="margin-top:0">Question Palette</h3>${palette}<div class="legend">🟢 Answered &nbsp; 🔴 Visited/Not Answered &nbsp; 🟣 Review &nbsp; 🟡 Review + Answered</div></aside></div></div>`;updateTimer();}
function finishCalc(){let correct=0,wrong=0,un=0;DATA.questions.forEach(Q=>{let a=state.answers[Q.id];let key=DATA.keys[Q.section][Q.number-1];if(a===undefined)un++;else if(String.fromCharCode(65+a)===key)correct++;else wrong++;});return{correct,wrong,un,marks:correct*3-wrong,percent:(correct*3-wrong)/360*100}}

function conceptPair(Q){const parts=String(Q.explanation||'').split(/\n\nEnglish:\s*/);return [parts[0]||'स्रोत की answer key के अनुसार सही उत्तर दिया गया है।',parts[1]||'The supplied answer key identifies the correct option.'];}
function renderResult(){let r=finishCalc();let timeTaken=Math.max(0,7200-state.seconds);let tm=Math.floor(timeTaken/60),ts=timeTaken%60;let timeText=String(tm).padStart(2,'0')+':'+String(ts).padStart(2,'0');let rows=DATA.sections.map(s=>{let qs=s.ids.map(id=>q(id));let c=0,w=0,u=0;qs.forEach(Q=>{let a=state.answers[Q.id];let k=DATA.keys[Q.section][Q.number-1];if(a===undefined)u++;else if(String.fromCharCode(65+a)===k)c++;else w++;});return `<tr><td>${esc(s.name)}</td><td>${s.count}</td><td>${c}</td><td>${w}</td><td>${u}</td><td>${c*3-w}</td></tr>`}).join('');let reviews=DATA.questions.map(Q=>{let a=state.answers[Q.id],k=DATA.keys[Q.section][Q.number-1],ai=k.charCodeAt(0)-65;let cls=a===undefined?'unans':(String.fromCharCode(65+a)===k?'correct':'wrong');let label=a===undefined?'Unattempted / अनुत्तरित':(String.fromCharCode(65+a)===k?'Correct / सही':'Incorrect / गलत');let cp=conceptPair(Q);let enExplain=`${esc(cp[1])}`;return `<div class="reviewq"><div><b>Q${Q.id}. हिन्दी:</b> ${esc(Q.hi)}</div><div><b>English:</b> ${esc(Q.en||Q.hi)}</div><p class="${cls}"><b>${label}</b><br>Hindi — Your answer: ${a===undefined?'—':String.fromCharCode(65+a)+') '+esc((Q.optionsHi[a]||''))} · Correct: ${k}) ${esc(Q.optionsHi[ai]||'')}<br>English — Your answer: ${a===undefined?'—':String.fromCharCode(65+a)+') '+esc((Q.optionsEn[a]||''))} · Correct: ${k}) ${esc(Q.optionsEn[ai]||'')}</p><p><b>Explanation / व्याख्या:</b><br><b>हिन्दी:</b> ${esc(Q.explanation)}<br><b>अवधारणा:</b> ${esc(cp[0])}<br><b>English:</b> ${enExplain}<br><b>Concept:</b> ${enExplain}</p></div>`}).join('');$('app').innerHTML=`<header class="top"><div class="brand">SUPER TET MOCK TEST 04</div><div class="name">Result</div></header><div class="wrap"><section class="card result"><div class="pdfHeader">© JobAlerT</div><div class="pdfFooter">© JobAlerT</div><div class="printOnly"><h1>SUPER TET MOCK TEST 04</h1><p><b>Response Sheet</b> · © JobAlerT</p></div><h1>Test Result / परीक्षा परिणाम</h1><p><b>Candidate / अभ्यर्थी:</b> ${esc(state.name)} &nbsp; <b>Starting language / प्रारंभिक भाषा:</b> ${esc(state.lang)}</p><div class="stats"><div class="stat">Correct / सही<b>${r.correct}</b></div><div class="stat">Incorrect / गलत<b>${r.wrong}</b></div><div class="stat">Unattempted / अनुत्तरित<b>${r.un}</b></div><div class="stat">Marks / अंक<b>${r.marks}/360</b></div><div class="stat">Percentage / प्रतिशत<b>${r.percent.toFixed(2)}%</b></div><div class="stat">Time Taken / समय लिया<b>${timeText}</b></div></div><div class="actions noPrint"><button class="btn primary" onclick="window.print()">Save Response Sheet as PDF / PDF में सेव करें</button></div><h2>Section-wise Analysis / विषयवार विश्लेषण</h2><table class="table"><tr><th>Section / अनुभाग</th><th>Total</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr>${rows}</table><h2>Question-wise Response & Explanation / प्रश्नवार उत्तर एवं व्याख्या</h2>${reviews}</section></div>`}
renderStart();
</script></body></html>
